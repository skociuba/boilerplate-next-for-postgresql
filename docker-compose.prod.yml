services:
  next-app:
    container_name: VPS-2-FE
    # ${IMAGE_TAG:-latest} — deploy (.github/workflows/deploy.yml) i
    # rollback (scripts/rollback.sh) podają IMAGE_TAG=X.Y.Z na czas
    # polecenia, nic się tu nie zapisuje trwale. :latest przesuwa tylko
    # release.yml przy wydaniu, więc ręczne `up` bez IMAGE_TAG też trafi
    # w ostatnie wydanie, a nie w ostatni merge.
    image: sebastiankociuba/node-frontend:${IMAGE_TAG:-latest}
    # 127.0.0.1: port tylko dla nginxa na tym samym serwerze. Docker sam
    # dopisuje reguły iptables i omija ufw, więc samo "3002:3000" wystawiało
    # aplikację na świat pod http://IP:3002 z pominięciem nginxa.
    ports:
      - '127.0.0.1:3002:3000'
    # Bez BASE_URL: adres API dla /api-proxy jest wpisany w obraz przy
    # buildzie (build-arg w CI, patrz Dockerfile). Zmienna tutaj niczego nie
    # zmieniała, a sugerowała, że zmienia.
    environment:
      - NODE_ENV=production
    restart: always
