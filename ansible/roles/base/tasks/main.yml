# Docker z paczek Ubuntu (docker.io), tak jak jest na serwerze, i Compose
# v2 — deploy i rollback obu aplikacji wołają `docker compose`, a stare
# docker-compose (v1) wywala się przy podmianie kontenera ("ContainerConfig").
# v1 zostaje zainstalowane: używają go inne projekty na tym serwerze.
- name: Install Docker and Compose v2
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Keep Docker running and enabled at boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

# Katalogi aplikacji: zawartość (docker-compose, skrypty) kopiuje deploy z
# GitHub Actions, a .env z sekretami tworzy się ręcznie — Ansible pilnuje
# tylko, żeby katalogi istniały
- name: Create application directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - '{{ vps2_backend_dir }}'
    - '{{ vps2_frontend_dir }}'
