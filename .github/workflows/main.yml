name: Deploy Frontend

# pull_request: lint, testy i build obrazu (bez push i deployu) na każdym PR
# do master — błąd ma wyjść przed merge'em, a nie dopiero na master.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Jeden przebieg naraz na gałąź. Na PR nowy push anuluje stary przebieg,
# na master nie — przerwany deploy (po down, przed up) zostawiłby stronę
# wyłączoną, więc kolejne deploye czekają w kolejce.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Stała nazwa joba = nazwa wymaganego checka w branch protection
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

  # Na PR obraz też się buduje (zepsuty Dockerfile albo next build wychodzi
  # przed merge'em), ale nie trafia do Docker Huba.
  build:
    name: build
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          # Cache warstw w GitHub Actions: zmiana w kodzie nie przebudowuje od
          # zera warstwy z npm install, jeśli package-lock się nie zmienił
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL || 'http://85.215.128.5/api-node' }}
            NEXT_PUBLIC_BASE_PATH=${{ vars.NEXT_PUBLIC_BASE_PATH || '/vps2' }}
            BASE_URL=${{ vars.BASE_URL || 'http://85.215.128.5/api-node' }}
          tags: |
            sebastiankociuba/node-frontend:latest
            sebastiankociuba/node-frontend:${{ github.sha }}
  deploy:
    name: Deploy Frontend Container
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose to server via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: 'docker-compose.prod.yml,scripts/'
          target: '/var/www/frontend-node'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            cd /var/www/frontend-node
            chmod +x scripts/rollback.sh

            if sudo docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi

            sudo $DC -f docker-compose.prod.yml down || true
            sudo $DC -f docker-compose.prod.yml pull
            sudo $DC -f docker-compose.prod.yml up -d

            status="starting"
            for i in $(seq 1 12); do
              status=$(sudo docker inspect --format='{{.State.Health.Status}}' VPS-2-FE 2>/dev/null || echo "unknown")
              if [ "$status" = "healthy" ]; then
                break
              fi
              if [ "$status" = "unhealthy" ]; then
                break
              fi
              sleep 5
            done

            if [ "$status" != "healthy" ]; then
              echo "Kontener nie osiągnął stanu healthy (status: $status)"
              sudo docker logs --tail=50 VPS-2-FE
              exit 1
            fi

            sudo docker image prune -f
