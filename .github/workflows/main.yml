name: Deploy Frontend

on:
  push:
    branches:
      - add,edit-delete

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            sebastiankociuba/node-frontend:latest
            sebastiankociuba/node-frontend:${{ github.sha }}
  deploy:
    name: Deploy Frontend Container
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            cd /var/www/frontend-node

            # Pobranie najnowszego obrazu
            sudo docker pull sebastiankociuba/node-frontend:latest

            # Zatrzymanie i usunięcie w jednej linii (szybsze)
            sudo docker rm -f nextjs-app || true

            # Uruchomienie
            sudo docker run -d --restart unless-stopped \
              -p 3000:3000 \
              --name nextjs-app \
              sebastiankociuba/node-frontend:latest

            # Sprzątanie nieużywanych obrazów
            sudo docker image prune -f
