name: Deploy Frontend

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

  build:
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL || 'http://85.215.128.5/api-node' }}
          tags: |
            sebastiankociuba/node-frontend:latest
            sebastiankociuba/node-frontend:${{ github.sha }}
  deploy:
    name: Deploy Frontend Container
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Copy docker-compose to server via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/var/www/frontend-node"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            cd /var/www/frontend-node

            if sudo docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi

            sudo $DC -f docker-compose.prod.yml down || true
            sudo $DC -f docker-compose.prod.yml pull
            sudo $DC -f docker-compose.prod.yml up -d

            status="starting"
            for i in $(seq 1 12); do
              status=$(sudo docker inspect --format='{{.State.Health.Status}}' VPS-2-FE 2>/dev/null || echo "unknown")
              if [ "$status" = "healthy" ]; then
                break
              fi
              if [ "$status" = "unhealthy" ]; then
                break
              fi
              sleep 5
            done

            if [ "$status" != "healthy" ]; then
              echo "Kontener nie osiągnął stanu healthy (status: $status)"
              sudo docker logs --tail=50 VPS-2-FE
              exit 1
            fi

            sudo docker image prune -f
