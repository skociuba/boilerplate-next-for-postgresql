name: Release

# Wersjonowanie z Conventional Commits (release-please):
# - każdy merge do master aktualizuje PR "chore(master): release X.Y.Z"
#   z podbitą wersją w package.json i nowymi wpisami w CHANGELOG.md
#   (feat → minor, fix → patch, "!" albo BREAKING CHANGE → major),
# - merge TEGO PR-a tworzy tag vX.Y.Z i GitHub Release z listą zmian,
# - obraz Dockera z tego commita dostaje tagi :X.Y.Z i :latest,
# - i dopiero TA wersja idzie na produkcję (deploy.yml).
# Continuous delivery: merge zwykłego PR-a = gotowe do wydania (ci.yml
# testuje i buduje obraz), a wdrożenie to osobna, świadoma decyzja — merge
# release PR-a. Kilka zmian może poczekać i wejść razem jedną wersją.
on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Dwa szybkie merge'e nie mogą liczyć wersji jednocześnie. Blokada tylko
    # na tym jobie, nie na całym workflow: deploy czeka na zatwierdzenie
    # w środowisku production i trzymałby ją godzinami, a kolejne merge'e
    # nie aktualizowałyby release PR-a. Deploy ma własną blokadę (deploy.yml).
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Osobny token zamiast domyślnego GITHUB_TOKEN: PR otwarty
          # GITHUB_TOKEN-em nie uruchamia workflowów, więc release PR nie
          # dostałby checków test/build i branch protection blokowałaby go
          # na zawsze. Fine-grained PAT: tylko to repo, Contents + Pull
          # requests: Read and write.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build once, deploy many: obraz nie jest budowany drugi raz, tylko obraz
  # z tego samego commita (:sha z ci.yml) dostaje nazwy :X.Y.Z i :latest.
  # Na produkcji stoi więc dokładnie ten plik, który przeszedł testy, a
  # rollback można zrobić po numerze wersji (deploy.yml albo
  # scripts/rollback.sh 1.2.0). :latest przesuwa się tylko tutaj, więc
  # zawsze wskazuje ostatnie wydanie — to, co jest na produkcji.
  tag-image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: sebastiankociuba/node-frontend
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ci.yml buduje ten obraz równolegle (ten sam push do master),
      # więc czekamy, aż :sha pojawi się w rejestrze — najwyżej 20 minut
      - name: Wait for the image built from this commit
        run: |
          for _ in $(seq 1 40); do
            if docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" >/dev/null 2>&1; then
              echo "Obraz $IMAGE:$GITHUB_SHA jest w rejestrze"
              exit 0
            fi
            sleep 30
          done
          echo "Obraz $IMAGE:$GITHUB_SHA nie pojawił się w rejestrze (czy ci.yml przeszedł?)" >&2
          exit 1

      - name: Tag the image with the release version
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            "$IMAGE:$GITHUB_SHA"

  # Ten sam workflow co ręczny deploy z zakładki Actions — jedna ścieżka
  # wdrożenia, więc ręczny rollback testuje się przy każdym wydaniu
  deploy:
    needs: [release-please, tag-image]
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    secrets: inherit
