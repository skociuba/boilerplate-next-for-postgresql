name: Release

# Wersjonowanie z Conventional Commits (release-please):
# - każdy merge do master aktualizuje PR "chore(master): release X.Y.Z"
#   z podbitą wersją w package.json i nowymi wpisami w CHANGELOG.md
#   (feat → minor, fix → patch, "!" albo BREAKING CHANGE → major),
# - merge TEGO PR-a tworzy tag vX.Y.Z i GitHub Release z listą zmian,
# - obraz Dockera z tego commita dostaje dodatkowo tag :X.Y.Z.
# Sam deploy dalej robi main.yml — release niczego nie wdraża, tylko
# nazywa wersję, która i tak trafia na produkcję po merge'u.
on:
  push:
    branches:
      - master

# Dwa szybkie merge'e nie mogą liczyć wersji jednocześnie
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Osobny token zamiast domyślnego GITHUB_TOKEN: PR otwarty
          # GITHUB_TOKEN-em nie uruchamia workflowów, więc release PR nie
          # dostałby checków test/build i branch protection blokowałaby go
          # na zawsze. Fine-grained PAT: tylko to repo, Contents + Pull
          # requests: Read and write.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build once, deploy many: obraz nie jest budowany drugi raz, tylko obraz
  # z tego samego commita (:sha z main.yml) dostaje drugą nazwę :X.Y.Z.
  # Na produkcji stoi więc dokładnie ten plik, który przeszedł testy, a
  # rollback można zrobić po numerze wersji (scripts/rollback.sh 1.2.0).
  tag-image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: sebastiankociuba/node-frontend
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # main.yml buduje ten obraz równolegle (ten sam push do master),
      # więc czekamy, aż :sha pojawi się w rejestrze — najwyżej 20 minut
      - name: Wait for the image built from this commit
        run: |
          for _ in $(seq 1 40); do
            if docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" >/dev/null 2>&1; then
              echo "Obraz $IMAGE:$GITHUB_SHA jest w rejestrze"
              exit 0
            fi
            sleep 30
          done
          echo "Obraz $IMAGE:$GITHUB_SHA nie pojawił się w rejestrze (czy main.yml przeszedł?)" >&2
          exit 1

      - name: Tag the image with the release version
        run: docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE:$GITHUB_SHA"
