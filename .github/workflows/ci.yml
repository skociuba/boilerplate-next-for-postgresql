name: CI

# Lint, testy i obraz dla każdego commita na master oraz każdego PR-a do
# master. NIE wdraża — produkcja idzie tylko z wydania (release.yml →
# deploy.yml), czyli po merge'u PR-a "chore(master): release X.Y.Z".
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Jeden przebieg naraz na gałąź. Na PR nowy push anuluje stary przebieg,
# na master nie — release.yml czeka na obraz :sha z KAŻDEGO commita
# release'owego, więc przerwany build zostawiłby wydanie bez obrazu.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Stała nazwa joba = nazwa wymaganego checka w branch protection
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      # Znane podatności w zależnościach produkcyjnych (te, które jadą do
      # obrazu). Tylko HIGH/CRITICAL: moderate/low nie blokują PR-a — te łata
      # Dependabot (.github/dependabot.yml) w swoim tempie. Ten krok zatrzymałby
      # Next 14 z krytycznym RCE, który stał na produkcji do wersji 1.1.x.
      # Skrypt zamiast gołego npm audit: pozwala na świadome wyjątki
      # z uzasadnieniem i datą ważności (audit-allowlist.json), gdy łatki nie ma.
      - name: Audit production dependencies
        run: node scripts/audit.mjs

  # Testy E2E: Chromium klika po zbudowanym frontendzie, który rozmawia
  # z prawdziwym backendem (obraz :latest, czyli to, co jest na produkcji),
  # bazą i MailDevem (e2e/docker-compose.yml). Równolegle z `test`.
  e2e:
    name: e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --wait: krok kończy się dopiero, gdy healthchecki są zielone
      # (backend po migracjach odpowiada na /health)
      - name: Start backend stack
        run: docker compose -f e2e/docker-compose.yml up -d --wait

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      # Raport HTML ze śladami (zrzuty, DOM, sieć) nieudanych testów —
      # do pobrania z zakładki Summary przebiegu
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Backend logs
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs api

  # Na PR obraz też się buduje (zepsuty Dockerfile albo next build wychodzi
  # przed merge'em), ale nie trafia do Docker Huba. Z master idzie tylko
  # :<sha> — :latest przesuwa release.yml przy wydaniu, więc :latest = to,
  # co jest na produkcji, a nie ostatni merge.
  build:
    name: build
    needs: [test, e2e]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Najpierw build do lokalnego Dockera (load), skan, dopiero potem push
      # — obraz z podatnością HIGH/CRITICAL nie trafia do rejestru, więc nie
      # da się go też wydać ani wdrożyć.
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          # Cache warstw w GitHub Actions: zmiana w kodzie nie przebudowuje od
          # zera warstwy z npm install, jeśli package-lock się nie zmienił
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Adres backendu po HTTPS (domena z certyfikatem Let's Encrypt na
          # nginx). BASE_URL wołany jest przez serwer Next.js (rewrite
          # /api-proxy), więc musi to być pełny publiczny adres, a nie
          # localhost kontenera. Zmienne repo (vars.*) mają pierwszeństwo.
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL || 'https://skociuba-vps2.duckdns.org/api-node' }}
            NEXT_PUBLIC_BASE_PATH=${{ vars.NEXT_PUBLIC_BASE_PATH || '/vps2' }}
            BASE_URL=${{ vars.BASE_URL || 'https://skociuba-vps2.duckdns.org/api-node' }}
          tags: sebastiankociuba/node-frontend:${{ github.sha }}

      # Trivy jako obraz przypięty do digestu, a nie aquasecurity/trivy-action
      # z tagiem: tagi tej akcji zostały w 2026 przejęte i podmienione na
      # kradnące sekrety — tag można przesunąć, digestu nie.
      # --ignore-unfixed: blokujemy tylko to, co da się naprawić.
      - name: Scan image for vulnerabilities (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "sebastiankociuba/node-frontend:${{ github.sha }}"

      # Ten sam build drugi raz, ale wszystkie warstwy są już w cache, więc
      # to tylko wysłanie gotowego obrazu do rejestru
      - name: Push frontend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL || 'https://skociuba-vps2.duckdns.org/api-node' }}
            NEXT_PUBLIC_BASE_PATH=${{ vars.NEXT_PUBLIC_BASE_PATH || '/vps2' }}
            BASE_URL=${{ vars.BASE_URL || 'https://skociuba-vps2.duckdns.org/api-node' }}
          tags: sebastiankociuba/node-frontend:${{ github.sha }}
