# Dependabot otwiera PR-y z aktualizacjami. Każdy przechodzi te same checki
# co zwykły PR (lint, testy, audyt, build ze skanem Trivy), więc merge jest
# bezpieczny, kiedy wszystko jest zielone.
#
# Poprzednia konfiguracja (codziennie, osobny PR na każdą paczkę) zostawiła
# kilkanaście wiszących PR-ów i została usunięta — a bez niej Next 14
# z krytycznymi podatnościami przeleżał na produkcji. Stąd grupowanie.
version: 2
updates:
  # Paczki npm: raz w miesiącu, maksymalnie dwa PR-y — jeden zbiorczy z
  # minor i patch (zwykle do merge'a od ręki) i jeden zbiorczy z majorami.
  # Major zwykle wymaga zmian w kodzie, więc ten drugi bywa czerwony: służy
  # za listę "co jest do zrobienia" — przegląda się go i zamyka albo bierze
  # jedną paczkę na osobny branch. Wcześniej (co tydzień, major osobno na
  # każdą paczkę) sam frontend dostał 12 PR-ów od Dependabota w miesiąc.
  #
  # Harmonogram i limit nie dotyczą łatek bezpieczeństwa: jeśli w ustawieniach
  # repo włączone są "Dependabot security updates", PR z łatką przychodzi
  # od razu po zgłoszeniu podatności.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
    # Conventional Commits: "build(deps): ..." — release-please chowa typ
    # build w CHANGELOG, więc aktualizacje nie zaśmiecają listy zmian
    commit-message:
      prefix: build
      include: scope
    # Major tych paczek to decyzja, a nie rutynowa aktualizacja:
    # - typescript 7 to nowy kompilator (Go) bez starego API dla JS, z
    #   którego korzystają narzędzia (w backendzie PR z 7.0.2 wywalił testy),
    # - @types/node ma pasować do Node, na którym aplikacja działa (22 w
    #   Dockerfile i CI), a nie do najnowszego,
    # - eslint-config-next idzie w parze z Next (16 jest dla Next 16 i ma już
    #   natywny flat config, więc FlatCompat w eslint.config.mjs przestaje
    #   działać) — podbijamy go razem z Next, nie osobno,
    # - @eslint/js 10 wymaga eslint 10, a eslint-plugin-react, -import
    #   i -jsx-a11y deklarują najwyżej eslint 9 — sam @eslint/js wywala
    #   npm ci (konflikt peer dependencies). ESLint 10 przenosimy w całości,
    #   jednym PR-em, kiedy pluginy go wesprą.
    # Minor i patch dalej przychodzą normalnie.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: eslint-config-next
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']

  # Wersje akcji w workflowach (actions/checkout@v4 itd.)
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # Obraz bazowy node:22-alpine w Dockerfile. Tylko łatki w obrębie Node 22:
  # zmiana wersji Node musi iść razem z node-version w CI i @types/node.
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
